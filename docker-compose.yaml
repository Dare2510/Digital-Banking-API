name: digital-banking-api

services:

  postgres:
    image: postgres:17
    container_name: db_banking
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "54433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


  app:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: digital-banking

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432

    ports:
      - "8081:8080"